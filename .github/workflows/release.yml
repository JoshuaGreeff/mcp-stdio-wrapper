name: Release

on:
  push:
    tags:
      - "v*"

permissions: read-all

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      NPM_TOKEN_PRESENT: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup npm 11 for trusted publishing
        run: |
          curl --fail --location --silent --show-error \
            https://registry.npmjs.org/npm/-/npm-11.11.1.tgz \
            --output "$RUNNER_TEMP/npm-11.11.1.tgz"
          echo "6ac6b30a876415dcf545e433ba4cb34bf0c3efbb86088a9415e446de0b5a4fc6fd511d277b59bd40e06e3204fbda28f5aeded346b3a8c780355b39ed31622e12  $RUNNER_TEMP/npm-11.11.1.tgz" | sha512sum --check --
          mkdir -p "$RUNNER_TEMP/npm-11.11.1"
          tar --extract --gzip --file "$RUNNER_TEMP/npm-11.11.1.tgz" --directory "$RUNNER_TEMP/npm-11.11.1"
          echo "$RUNNER_TEMP/npm-11.11.1/package/bin" >> "$GITHUB_PATH"

      - name: Install
        run: npm ci

      - name: Validate
        run: |
          npm run check
          npm test

      - name: Pack
        run: npm pack

      - name: Publish to npm with token
        if: ${{ env.NPM_TOKEN_PRESENT != '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          {
            echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}"
            echo "registry=https://registry.npmjs.org/"
          } > "$RUNNER_TEMP/.npmrc"
          npm publish --provenance --access public --userconfig "$RUNNER_TEMP/.npmrc"

      - name: Publish to npm with trusted publishing
        if: ${{ env.NPM_TOKEN_PRESENT == '' }}
        run: npm publish --provenance --access public
