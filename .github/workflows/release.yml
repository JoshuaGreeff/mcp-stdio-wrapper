name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      NPM_TOKEN_PRESENT: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup npm 11 for trusted publishing
        run: npm install --global npm@^11.10.0

      - name: Install
        run: npm ci

      - name: Validate
        run: |
          npm run check
          npm test

      - name: Pack
        run: npm pack

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.tgz"

      - name: Publish to npm with token
        if: ${{ env.NPM_TOKEN_PRESENT != '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          {
            echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}"
            echo "registry=https://registry.npmjs.org/"
          } > "$RUNNER_TEMP/.npmrc"
          npm publish --provenance --access public --userconfig "$RUNNER_TEMP/.npmrc"

      - name: Publish to npm with trusted publishing
        if: ${{ env.NPM_TOKEN_PRESENT == '' }}
        run: npm publish --provenance --access public
